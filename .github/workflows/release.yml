name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign, notarize, and verify DMG
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        timeout-minutes: 5

      - name: Resolve release identity
        id: release
        timeout-minutes: 2
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(scripts/release/version-from-tag.sh "$TAG")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Require release credentials
        timeout-minutes: 2
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARYTOOL_API_KEY_ID: ${{ secrets.APPLE_NOTARYTOOL_API_KEY_ID }}
          APPLE_NOTARYTOOL_API_ISSUER_ID: ${{ secrets.APPLE_NOTARYTOOL_API_ISSUER_ID }}
          APPLE_NOTARYTOOL_API_KEY: ${{ secrets.APPLE_NOTARYTOOL_API_KEY }}
        run: |
          : "${APPLE_DEVELOPER_ID_CERT:?APPLE_DEVELOPER_ID_CERT is required}"
          : "${APPLE_DEVELOPER_ID_CERT_PASSWORD:?APPLE_DEVELOPER_ID_CERT_PASSWORD is required}"
          : "${APPLE_DEVELOPER_IDENTITY:?APPLE_DEVELOPER_IDENTITY is required}"
          : "${APPLE_KEYCHAIN_PASSWORD:?APPLE_KEYCHAIN_PASSWORD is required}"
          : "${APPLE_NOTARYTOOL_API_KEY_ID:?APPLE_NOTARYTOOL_API_KEY_ID is required}"
          : "${APPLE_NOTARYTOOL_API_ISSUER_ID:?APPLE_NOTARYTOOL_API_ISSUER_ID is required}"
          : "${APPLE_NOTARYTOOL_API_KEY:?APPLE_NOTARYTOOL_API_KEY is required}"

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        timeout-minutes: 5
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        timeout-minutes: 5
        run: brew install xcodegen

      - name: Import Developer ID certificate
        timeout-minutes: 5
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: scripts/release/import-cert.sh

      - name: Build and sign app
        timeout-minutes: 20
        env:
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: scripts/release/build-and-sign.sh

      - name: Verify app version and architectures
        timeout-minutes: 2
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          APP="dist/PowerSnek.app"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist")"
          [[ "$ACTUAL_VERSION" == "$VERSION" ]] || {
            echo "tag version $VERSION does not match app version $ACTUAL_VERSION"
            exit 1
          }
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/PowerSnek")"
          [[ " $ARCHS " == *" arm64 "* && " $ARCHS " == *" x86_64 "* ]] || {
            echo "expected arm64 and x86_64, found: $ARCHS"
            exit 1
          }

      - name: Package DMG
        timeout-minutes: 5
        env:
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
        run: scripts/release/make-dmg.sh "${{ steps.release.outputs.version }}"

      - name: Notarize and staple DMG
        timeout-minutes: 20
        env:
          APPLE_NOTARYTOOL_API_KEY_ID: ${{ secrets.APPLE_NOTARYTOOL_API_KEY_ID }}
          APPLE_NOTARYTOOL_API_ISSUER_ID: ${{ secrets.APPLE_NOTARYTOOL_API_ISSUER_ID }}
          APPLE_NOTARYTOOL_API_KEY: ${{ secrets.APPLE_NOTARYTOOL_API_KEY }}
        run: scripts/release/notarize.sh "dist/PowerSnek-${{ steps.release.outputs.version }}.dmg"

      - name: Checksum and verify DMG
        timeout-minutes: 5
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          cd dist
          shasum -a 256 "PowerSnek-$VERSION.dmg" > "PowerSnek-$VERSION.dmg.sha256"
          shasum -a 256 -c "PowerSnek-$VERSION.dmg.sha256"
          codesign --verify --strict --verbose=2 "PowerSnek-$VERSION.dmg"
          xcrun stapler validate "PowerSnek-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "PowerSnek-$VERSION.dmg"

      - name: Tear down signing keychain
        if: always()
        timeout-minutes: 1
        run: security delete-keychain "${RUNNER_TEMP:-/tmp}/powersnek-signing.keychain-db" 2>/dev/null || true

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: PowerSnek-${{ steps.release.outputs.version }}
          path: dist/PowerSnek-*.dmg*
          if-no-files-found: error

  publish-draft-release:
    name: Publish and verify draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          path: dist
          merge-multiple: true

      - name: Create or update draft release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          : "${TAG:?build job did not provide a release tag}"
          : "${VERSION:?build job did not provide a release version}"
          DMG="PowerSnek-$VERSION.dmg"
          CHECKSUM="$DMG.sha256"
          test -s "dist/$DMG"
          test -s "dist/$CHECKSUM"
          (cd dist && sha256sum -c "$CHECKSUM")

          if gh release view "$TAG" >/dev/null 2>&1; then
            [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == "true" ]] || {
              echo "refusing to modify published release $TAG"
              exit 1
            }
            gh release upload "$TAG" "dist/$DMG" "dist/$CHECKSUM" --clobber
          else
            gh release create "$TAG" "dist/$DMG" "dist/$CHECKSUM" --draft --title "$TAG" \
              --generate-notes
          fi

      - name: Verify uploaded draft
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          : "${TAG:?build job did not provide a release tag}"
          : "${VERSION:?build job did not provide a release version}"
          DMG="PowerSnek-$VERSION.dmg"
          CHECKSUM="$DMG.sha256"
          RELEASE="$(gh release view "$TAG" --json tagName,isDraft,assets)"
          jq -e --arg tag "$TAG" '($tag | length) > 0 and .tagName == $tag and .isDraft == true' <<< "$RELEASE"
          jq -e --arg dmg "$DMG" --arg checksum "$CHECKSUM" \
            'any(.assets[]; .name == $dmg and .size > 0) and any(.assets[]; .name == $checksum and .size > 0)' \
            <<< "$RELEASE"

          mkdir downloaded
          gh release download "$TAG" --dir downloaded --pattern "$DMG" --pattern "$CHECKSUM"
          (cd downloaded && sha256sum -c "$CHECKSUM")
